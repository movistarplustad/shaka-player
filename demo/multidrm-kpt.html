        async function probeSupport() {

            const testKeySystems = [
                'org.w3.clearkey',
                'com.widevine.alpha',
                'com.microsoft.playready',
                'com.microsoft.playready.recommendation',
                'com.apple.fps.1_0',
                'com.apple.fps',
                'com.adobe.primetime',
            ];

            const basicVideoCapabilities = [
                { contentType: 'video/mp4; codecs="avc1.42E01E"' },
            ];

            const basicConfig = {
                initDataTypes: ['cenc'],
                videoCapabilities: basicVideoCapabilities,
            };
            const offlineConfig = {
                videoCapabilities: basicVideoCapabilities,
                persistentState: 'required',
                sessionTypes: ['persistent-license'],
            };

            // Try the offline config first, then fall back to the basic config.
            const configs = [offlineConfig, basicConfig];

            /** @type {!Map.<string, ?shaka.extern.DrmSupportType>} */
            const support = new Map();

            const testSystem = async (keySystem) => {
                try {
                    // Our Polyfill will reject anything apart com.apple.fps key systems.
                    // It seems the Safari modern EME API will allow to request a
                    // MediaKeySystemAccess for the ClearKey CDM, create and update a key
                    // session but playback will never start
                    // Safari bug: https://bugs.webkit.org/show_bug.cgi?id=231006
                    let isSafari = true;
                    if (keySystem === 'org.w3.clearkey' && isSafari) {
                        throw new Error('Unsupported keySystem');
                    }

                    const access = await navigator.requestMediaKeySystemAccess(
                        keySystem, configs);

                    // Edge doesn't return supported session types, but current versions
                    // do not support persistent-license.  If sessionTypes is missing,
                    // assume no support for persistent-license.
                    // TODO: Polyfill Edge to return known supported session types.
                    // Edge bug: https://bit.ly/2IeKzho
                    const sessionTypes = access.getConfiguration().sessionTypes;
                    let persistentState = sessionTypes ?
                        sessionTypes.includes('persistent-license') : false;

                    support.set(keySystem, { persistentState: persistentState });
                    await access.createMediaKeys();
                } catch (e) {
                    // Either the request failed or createMediaKeys failed.
                    // Either way, write null to the support object.
                    support.set(keySystem, null);
                }
            };

            // Test each key system.
            const tests = testKeySystems.map((keySystem) => testSystem(keySystem));
            await Promise.all(tests);
            return asObject(support);
        }
        function asObject(map) {
            const obj = {};
            map.forEach((value, key) => {
                obj[key] = value;
            });

            return obj;

        function decodePSSH(pssh) {
            // Respetar byteOffset: el Uint8Array puede ser un subarray del buffer
            // subyacente, por lo que hay que usar (buffer, byteOffset, byteLength)
            let dataView = new DataView(pssh.buffer, pssh.byteOffset, pssh.byteLength);
            let index = 0;

            // 2️⃣ Leer tamaño del box
            let boxSize = dataView.getUint32(index);
            index += 4;

            // 3️⃣ Leer tipo de box (debe ser 'pssh' = 0x70737368)
            let boxType = String.fromCharCode(
                dataView.getUint8(index), dataView.getUint8(index + 1),
                dataView.getUint8(index + 2), dataView.getUint8(index + 3)
            );
            index += 4;

            if (boxType !== 'pssh') {
                throw new Error('No es un PSSH válido');
            }

            // 4️⃣ Leer versión y flags (flags siempre 0)
            let version = dataView.getUint8(index);
            index += 4; // 1 byte de versión + 3 bytes de flags

            // 5️⃣ Leer SystemID (UUID del DRM)
            let systemID = [];
            for (let i = 0; i < 16; i++) {
                systemID.push(dataView.getUint8(index).toString(16).padStart(2, '0'));
                if ([3, 5, 7, 9].includes(i)) systemID.push('-'); // Formato UUID
                index++;
            }
            systemID = systemID.join('');

            // 6️⃣ Leer cantidad de KIDs (si versión = 1)
            let kids = [];
            if (version === 1) {
                let kidCount = dataView.getUint32(index);
                index += 4;

                for (let i = 0; i < kidCount; i++) {
                    let kid = [];
                    for (let j = 0; j < 16; j++) {
                        kid.push(dataView.getUint8(index).toString(16).padStart(2, '0'));
                        index++;
                    }
                    kids.push(kid.join(''));
                }
            }

            // 7️⃣ Leer tamaño del payload
            let dataSize = dataView.getUint32(index);
            index += 4;

            // 8️⃣ Leer payload binario
            let payload = pssh.slice(index, index + dataSize);

            // 9️⃣ Si el KID no se encuentra en versión 1, intentar extraerlo del payload (Widevine)
            if (kids.length === 0 && systemID === "edef8ba9-79d6-4ace-a3c8-27dcd51d21ed") {
                try {
                    let payloadView = new DataView(payload.buffer, payload.byteOffset, payload.byteLength);
                    let kidIndex = payload.indexOf(18); // Buscar el prefijo que precede al KID
                    if (kidIndex !== -1 && kidIndex + 16 <= payload.length) {
                        let kid = [];
                        for (let i = 0; i < 16; i++) {
                            kid.push(payloadView.getUint8(kidIndex + 2 + i).toString(16).padStart(2, '0'));
                        }
                        kids.push(kid.join(''));
                    }
                } catch (e) {
                    console.warn("No se pudo extraer el KID del payload");
                }
            }

            return { systemID, version, kids, payload };
        }
        function decodeWidevinePSSHPayload(payload) {
            const view = new DataView(payload.buffer, payload.byteOffset, payload.byteLength);
            let i = 0;
            const result = { provider: null, contentId: null, cryptoPeriodIndex: null, protectionScheme: null };

            function readVarint() {
                let value = 0, shift = 0, byte;
                do {
                    byte = view.getUint8(i++);
                    value |= (byte & 0x7F) << shift;
                    shift += 7;
                } while (byte & 0x80);
                return value;
            }

            while (i < payload.byteLength) {
                const tag = readVarint();
                const fieldNumber = tag >> 3;
                const wireType = tag & 0x07;

                if (wireType === 2) { // length-delimited
                    const len = readVarint();
                    const bytes = payload.slice(i, i + len);
                    if (fieldNumber === 3) result.provider = new TextDecoder().decode(bytes);
                    if (fieldNumber === 4) result.contentId = Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join('');
                    i += len;
                } else if (wireType === 0) { // varint
                    const val = readVarint();
                    if (fieldNumber === 7) result.cryptoPeriodIndex = val;
                    if (fieldNumber === 9) result.protectionScheme = String.fromCharCode(...[(val >> 24) & 0xff, (val >> 16) & 0xff, (val >> 8) & 0xff, val & 0xff]);
                } else if (wireType === 5) { // 32-bit
                    const val = view.getUint32(i, true);
                    if (fieldNumber === 9) result.protectionScheme = String.fromCharCode(...[(val >> 24) & 0xff, (val >> 16) & 0xff, (val >> 8) & 0xff, val & 0xff]);
                    i += 4;
                } else { i++; }
            }
            return result;
        }
        function uint8ToBase64(uint8) {
            let binary = '';
            for (let i = 0; i < uint8.length; i++) binary += String.fromCharCode(uint8[i]);
            return btoa(binary);
        }

        onfocus="this.style.outline='3px solid #fff';" onblur="this.style.outline='3px solid transparent';">
        ▶ Play
    </button>
</body>
