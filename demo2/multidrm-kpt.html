        function getMyContentId(initData) {
            var contentId = String.fromCharCode.apply(null, new Uint16Array(initData.buffer));

            var parts = contentId.split("//");
            if (parts.length != 2) {
                throw "Invalid content key format";
            }

            return parts[1];
        }
        function stringToArray(string) {
            var buffer = new ArrayBuffer(string.length * 2); // 2 bytes for each char
            var array = new Uint16Array(buffer);
            for (var i = 0; i < string.length; i++) {
                array[i] = string.charCodeAt(i);
            }
            return array;
        }
        // viene del metodo concatInitDataIdAndCertificate de hasplayer
        function initDataTransform (initData, id, cert) {
            if (typeof id == "string")
                id = stringToArray(id);

            // layout is [initData][4 byte: idLength][idLength byte: id][4 byte:certLength][certLength byte: cert]
            var offset = 0;
            var buffer = new ArrayBuffer(initData.byteLength + 4 + id.byteLength + 4 + cert.byteLength);
            var dataView = new DataView(buffer);

            var initDataArray = new Uint8Array(buffer, offset, initData.byteLength);
            initDataArray.set(initData);
            offset += initDataArray.byteLength;

            dataView.setUint32(offset, id.byteLength, true);
            offset += 4;

            var idArray = new Uint16Array(buffer, offset, id.length);
            idArray.set(id);
            offset += idArray.byteLength;

            dataView.setUint32(offset, cert.byteLength, true);
            offset += 4;

            var certArray = new Uint8Array(buffer, offset, cert.byteLength);
            certArray.set(cert);

            console.log(initData, id, cert);
            console.log(new Uint8Array(buffer, 0, buffer.byteLength));
            return new Uint8Array(buffer, 0, buffer.byteLength);
        }
